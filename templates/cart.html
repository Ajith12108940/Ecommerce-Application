<!DOCTYPE html>
<html lang="en">

<head>

    <title>{{title}}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <div class="logo">
        Flipkart
    </div>

    <a href="/">Home</a>

</div>

<h1 class="title">

    {{title}}

</h1>

<div class="products">

{% for item in items %}

<div class="card">

    <img src="{{item.image}}">

    <h2>{{item.name}}</h2>

    <h3>₹{{item.price}}</h3>

</div>

{% endfor %}

</div>

<h1 class="total">

    Total: ₹{{total}}

</h1>

</body>

</html>
